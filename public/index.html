<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="<%= BASE_URL %>favicon.ico" />
    <!-- 使用 CDN 加速的 CSS 文件，配置在 vue.config.js 下 -->
    <% for (var i in
    htmlWebpackPlugin.options.cdn&&htmlWebpackPlugin.options.cdn.css) { %>
    <link
      href="<%= htmlWebpackPlugin.options.cdn.css[i] %>"
      rel="preload"
      as="style"
    />
    <link href="<%= htmlWebpackPlugin.options.cdn.css[i] %>" rel="stylesheet" />
    <% } %>
    <title><%= htmlWebpackPlugin.options.title %></title>
    <script src="/setting.js"></script>
    <!-- 使用 CDN 加速的 JS 文件，配置在 vue.config.js 下 -->
    <% for (var i in
    htmlWebpackPlugin.options.cdn&&htmlWebpackPlugin.options.cdn.js) { %>
    <script src="<%= htmlWebpackPlugin.options.cdn.js[i] %>"></script>
    <% } %>
  </head>

  <body>
    <div id="app"></div>
    <script src="/app.js"></script>
    
    <!-- ĐOẠN MÃ LƯU LỊCH SỬ BẮT ĐẦU TỪ ĐÂY -->
    <script>
    try {
        document.addEventListener('click', function(e) {
            let link = e.target.closest('a');
            if (link && link.href) {
                let path = new URL(link.href).pathname;
                if (path !== '/' && !link.href.includes('?a=')) { 
                    let history = JSON.parse(localStorage.getItem('watched_history') || '{}');
                    history[path] = true;
                    localStorage.setItem('watched_history', JSON.stringify(history));
                }
            }
        });

        setInterval(() => {
            let history = JSON.parse(localStorage.getItem('watched_history') || '{}');
            document.querySelectorAll('a').forEach(link => {
                if (link.href) {
                    let path = new URL(link.href).pathname;
                    if (history[path]) {
                        link.style.opacity = '0.4'; 
                    }
                }
            });
        }, 1000);
    } catch(e) {}
    </script>
    <!-- ĐOẠN MÃ LƯU LỊCH SỬ KẾT THÚC -->

  </body>
</html>
